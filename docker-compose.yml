services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       xwall
      POSTGRES_USER:     xwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No 'ports' mapping — DB is only accessible inside the Docker network.
    # Never expose 5432 to the host in production.
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xwall -d xwall"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  # ── Node.js app ───────────────────────────────────────────────────────────
  web:
    build: .
    container_name: xwall
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Bind only to loopback so only Nginx (on the same host/network) can reach it.
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://xwall:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/xwall
      - TRUST_PROXY=1
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp                # Express / node may need to write to /tmp
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 0.50

  # ── Nginx TLS terminator ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 64m

networks:
  backend:   # db ↔ web only
  frontend:  # web ↔ nginx only

volumes:
  db_data:
