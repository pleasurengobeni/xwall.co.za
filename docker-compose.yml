services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       xwall
      POSTGRES_USER:     xwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    # No 'ports' mapping — DB is only accessible inside the Docker network.
    # Never expose 5432 to the host in production.
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xwall -d xwall"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  # ── Node.js app ───────────────────────────────────────────────────────────
  web:
    build: .
    container_name: xwall
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Bind to loopback only: the host nginx (nginx/host.conf) is the single
    # internet-facing hop and proxies to 127.0.0.1:3002.
    ports:
      - "127.0.0.1:3002:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://xwall:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/xwall
      - TRUST_PROXY=1
    security_opt:
      - no-new-privileges:true
    # Node needs no Linux capabilities (listens on unprivileged port 3000)
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev   # Express / node may need to write to /tmp
    pids_limit: 200
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 512m
    cpus: 0.50

networks:
  backend:   # db ↔ web only

volumes:
  db_data:
