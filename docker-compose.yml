services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       xwall
      POSTGRES_USER:     xwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xwall_dev_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xwall -d xwall"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Node.js app ───────────────────────────────────────────────────────────
  web:
    build: .
    container_name: xwall
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://xwall:${POSTGRES_PASSWORD:-xwall_dev_password}@db:5432/xwall
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  db_data:
