# nginx/conf.d/default.conf
# TLS-terminating reverse proxy for xwall.co.za
#
# Prerequisites:
#   Place your SSL certificate and key in nginx/ssl/:
#     nginx/ssl/cert.pem   ← full-chain certificate
#     nginx/ssl/key.pem    ← private key
#
#   For production (Let's Encrypt):
#     certbot certonly --standalone -d xwall.co.za
#     cp /etc/letsencrypt/live/xwall.co.za/fullchain.pem nginx/ssl/cert.pem
#     cp /etc/letsencrypt/live/xwall.co.za/privkey.pem  nginx/ssl/key.pem
#
#   For local self-signed testing:
#     openssl req -x509 -newkey rsa:4096 -keyout nginx/ssl/key.pem \
#       -out nginx/ssl/cert.pem -days 365 -nodes \
#       -subj "/CN=localhost"

# Never advertise the Nginx version
server_tokens off;

# Rate-limit Nginx layer: 30 req/s per IP (burst of 60 queued without delay)
limit_req_zone  $binary_remote_addr zone=xwall:10m       rate=30r/s;
# Admin login brute-force guard (Express also limits failed attempts)
limit_req_zone  $binary_remote_addr zone=xwall_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=xwall_conn:10m;

# Slow-client (slowloris) protection
client_header_timeout 15s;
client_body_timeout   15s;
send_timeout          30s;

# ── Catch-all: reject requests for unknown hosts ──────────────────────────────
# Bots scanning by IP address or sending forged Host headers never reach the app.
server {
    listen 80  default_server;
    listen 443 ssl default_server;
    server_name _;

    # Abort the TLS handshake instead of presenting the real certificate
    ssl_reject_handshake on;

    # Container healthcheck (docker-compose) — loopback only
    location = /nginx-health {
        allow 127.0.0.1;
        allow ::1;
        deny  all;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 444;   # close the connection without a response
    }
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name xwall.co.za www.xwall.co.za;

    # Allow ACME (Let's Encrypt) challenge over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS reverse proxy ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name xwall.co.za www.xwall.co.za;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Strong TLS settings
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    # ── Security headers ──────────────────────────────────────────────────────
    # Set here once; the matching headers from Express (Helmet) are hidden below
    # so browsers never receive duplicate or conflicting values.
    # HSTS — after SSL is confirmed working, increase max-age to 31536000
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options   "nosniff"       always;
    add_header X-Frame-Options          "SAMEORIGIN"    always;
    # Must not be "no-referrer": YouTube embeds require the embedding origin
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Only the methods the app actually uses
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    limit_req        zone=xwall burst=60 nodelay;
    limit_req_status 429;
    limit_conn       xwall_conn 50;
    limit_conn_status 429;

    # Request size cap (matches Express 10 kb + overhead tolerance)
    client_max_body_size 128k;

    # Timeouts
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    # ── Upstream settings (inherited by every location below) ─────────────────
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";

    # Forward real client IP to Express trust proxy. X-Forwarded-For is
    # replaced (not appended) so clients cannot inject spoofed addresses.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;

    # Hidden files and common exploit-scanner targets never reach the app
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* \.(php[0-9]?|phtml|asp|aspx|jsp|cgi|env|ini|sql|bak|old|swp|git)$ {
        return 404;
    }

    location = /admin/login {
        limit_req zone=xwall_login burst=5 nodelay;
        # No compression on pages that carry CSRF tokens (BREACH)
        gzip off;
        proxy_pass http://web:3000;
    }

    location /admin {
        gzip off;
        proxy_pass http://web:3000;
    }

    location / {
        gzip            on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary       on;
        gzip_types      text/css application/javascript application/json image/svg+xml;
        proxy_pass http://web:3000;
    }
}
