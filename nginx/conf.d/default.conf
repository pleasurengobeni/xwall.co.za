# nginx/conf.d/default.conf
# TLS-terminating reverse proxy for xwall.co.za
#
# Prerequisites:
#   Place your SSL certificate and key in nginx/ssl/:
#     nginx/ssl/cert.pem   ← full-chain certificate
#     nginx/ssl/key.pem    ← private key
#
#   For production (Let's Encrypt):
#     certbot certonly --standalone -d xwall.co.za
#     cp /etc/letsencrypt/live/xwall.co.za/fullchain.pem nginx/ssl/cert.pem
#     cp /etc/letsencrypt/live/xwall.co.za/privkey.pem  nginx/ssl/key.pem
#
#   For local self-signed testing:
#     openssl req -x509 -newkey rsa:4096 -keyout nginx/ssl/key.pem \
#       -out nginx/ssl/cert.pem -days 365 -nodes \
#       -subj "/CN=localhost"

# Rate-limit Nginx layer: 30 req/s per IP (burst of 60 queued without delay)
limit_req_zone $binary_remote_addr zone=xwall:10m rate=30r/s;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name xwall.co.za www.xwall.co.za;

    # Allow ACME (Let's Encrypt) challenge over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS reverse proxy ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2  on;
    server_name xwall.co.za www.xwall.co.za;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Strong TLS settings
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers  off;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    # HSTS — after SSL is confirmed working, increase max-age to 31536000
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Additional hardening headers (Helmet handles these in Express too, but
    # defence-in-depth at the proxy layer adds resilience)
    add_header X-Content-Type-Options   "nosniff"       always;
    add_header X-Frame-Options          "SAMEORIGIN"    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    limit_req      zone=xwall burst=60 nodelay;
    limit_req_status 429;

    # Request size cap (matches Express 10 kb + overhead tolerance)
    client_max_body_size 128k;

    # Timeouts
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    location / {
        proxy_pass         http://web:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade support (keep-alive connections)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client IP to Express trust proxy
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not expose Nginx version to clients
        proxy_hide_header X-Powered-By;
    }
}
