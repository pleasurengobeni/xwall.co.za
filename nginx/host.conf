# ─── Host nginx reverse proxy — xwall.co.za ─────────────────────────────────
#
# This file lives in the repo at nginx/host.conf and is deployed to
# /etc/nginx/sites-available/xwall.co.za on the server, matching every other
# site on this host (see /opt/hungu, /opt/plengodesigns, /opt/zonkegame,
# /opt/lulamisapay).
#
# The host nginx is the single internet-facing hop: it terminates TLS and
# proxies to the xwall web container, which is published on 127.0.0.1:3002 only
# (see docker-compose.yml). There is no nginx container for this app.
#
# Install / update:
#   sudo cp /opt/xwall/nginx/host.conf /etc/nginx/sites-available/xwall.co.za
#   sudo ln -sf /etc/nginx/sites-available/xwall.co.za /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Requirements:
#   - cert at /etc/letsencrypt/live/xwall.co.za/ (certbot certonly --webroot)
#   - xwall container healthy on 127.0.0.1:3002
#
# The certificate covers both names (SANs: xwall.co.za, www.xwall.co.za).
# www is redirected to the apex over both HTTP and HTTPS so there is one
# canonical site. Reissue or expand with:
#   certbot certonly --webroot -w /var/www/certbot --cert-name xwall.co.za \
#     -d xwall.co.za -d www.xwall.co.za --expand
# ─────────────────────────────────────────────────────────────────────────────

# Per-IP limits. These sit in nginx's http context, which is where
# sites-enabled files are included. Names are prefixed so they cannot collide
# with the zones declared by the other sites on this host.
limit_req_zone $binary_remote_addr zone=xwall_site:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=xwall_login:10m rate=10r/m;

# HTTP — redirect everything to the canonical HTTPS apex; allow ACME through.
server {
    listen 80;
    listen [::]:80;
    server_name xwall.co.za www.xwall.co.za;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://xwall.co.za$request_uri;
    }
}

# HTTPS on www — redirect to the canonical apex. Without this block, https://www
# fell through to another site's server block and presented its certificate,
# so browsers showed "Your connection is not private".
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.xwall.co.za;

    ssl_certificate     /etc/letsencrypt/live/xwall.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xwall.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://xwall.co.za$request_uri;
}

# HTTPS — terminate TLS, proxy to the app container on localhost.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xwall.co.za;

    ssl_certificate     /etc/letsencrypt/live/xwall.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xwall.co.za/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_xwall:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    limit_req_status  429;
    limit_conn_status 429;
    client_max_body_size 128k;   # Express caps bodies at 10 kb

    # Slow-client (slowloris) protection
    client_header_timeout 15s;
    client_body_timeout   15s;
    send_timeout          30s;

    # HSTS belongs with TLS, so it is set here. Helmet also emits one from the
    # app; hide that copy so browsers receive exactly one header. Every other
    # security header (CSP, nosniff, frame options, referrer and permissions
    # policy) is set by the app in server.js and passes through untouched.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Only the methods the app actually uses
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # ── Upstream settings (inherited by every location below) ────────────────
    proxy_http_version 1.1;
    proxy_set_header   Connection        "";
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;
    proxy_hide_header     X-Powered-By;

    # Hidden files and common exploit-scanner targets never reach the app
    location ~ /\.(?!well-known/) {
        return 404;
    }
    location ~* \.(php[0-9]?|phtml|asp|aspx|jsp|cgi|env|ini|sql|bak|old|swp|git)$ {
        return 404;
    }

    # Admin login: brute-force guard in front of the app's own 5-per-15-minutes
    # limit. No compression on pages carrying CSRF tokens (BREACH).
    location = /admin/login {
        limit_req zone=xwall_login burst=5 nodelay;
        gzip off;
        proxy_pass http://127.0.0.1:3002;
    }

    location /admin {
        gzip off;
        proxy_pass http://127.0.0.1:3002;
    }

    location / {
        limit_req zone=xwall_site burst=60 nodelay;

        gzip            on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_vary       on;
        gzip_types      text/css application/javascript application/json image/svg+xml;

        proxy_pass http://127.0.0.1:3002;
    }
}
